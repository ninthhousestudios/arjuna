name: arjuna_workspace
publish_to: none

environment:
  sdk: ^3.11.0

workspace:
  - arrow
  - arrow/options
  - arrow/swe
  - arrow/core
  - arrow/calc
  - arrow/tool
  - quiver/core
  - quiver/server
  - quiver/embedded
  - nock
  - bowyer/core
  - bowyer/cli
  - drishti

dev_dependencies:
  melos: ^7.5.0

melos:
  name: arjuna

  command:
    bootstrap:
      runPubGetInParallel: true

  scripts:
    analyze:
      exec: dart analyze
    test:
      exec: dart test
    generate:
      exec: dart run build_runner build --delete-conflicting-outputs
      select-package:
        depends-on: build_runner
    protogen:
      # Requires: dart pub global activate protoc_plugin
      # (installs protoc-gen-dart to $HOME/.pub-cache/bin/)
      description: Regenerate Dart proto stubs from .proto files
      run: |
        protoc \
          --proto_path=proto \
          --plugin=protoc-gen-dart=$HOME/.pub-cache/bin/protoc-gen-dart \
          --dart_out=grpc:quiver/core/lib/src/generated \
          proto/arrow/types.proto \
          proto/arrow/chart.proto \
          proto/quiver/health.proto \
          proto/quiver/types.proto \
          proto/quiver/chart.proto \
          proto/grpc/health/v1/health.proto
