  "d881b8c0f25e46c3",  # method → complexity:zero
  "3a973bdbceb0d13f",  # is_method → complexity:zero
  "b1f85372069ef62e",  # private (component) → in:core
  "19f2bfefacb41361",  # has_sig (component) → in:core
  "3c10c68f6b40b090",  # constructor → CamelCase
  "8f4386aa2dea9b5d",  # returns_future → kind:method
  "2ce1574a7ba1c168",  # returns_future → is_method
  "fb38bf3d2555bbe3",  # returns_future → in:server
