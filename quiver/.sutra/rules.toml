# .sutra/rules.toml — Architectural constraints for Quiver
#
# Severity levels:
#   blocking      — guard denies edits that introduce these
#   advisory      — warning in review, agent proceeds
#   informational — tracked in review output, silent otherwise

# ═══════════════════════════════════════════════════════════════════
# Package layering
# ═══════════════════════════════════════════════════════════════════
# core/ is the shared foundation; server/ and embedded/ are independent
# deployment modes that depend on core/ but never on each other.

[[constraint]]
kind = "forbidden_dep"
from = "core/**"
to = "server/**"
name = "core-no-server-dep"
severity = "blocking"
provenance = "quiver/CLAUDE.md: 'embedded/ and server/ do not depend on each other'"

[[constraint]]
kind = "forbidden_dep"
from = "core/**"
to = "embedded/**"
name = "core-no-embedded-dep"
severity = "blocking"
provenance = "quiver/CLAUDE.md: 'embedded/ and server/ do not depend on each other'"

[[constraint]]
kind = "forbidden_dep"
from = "embedded/**"
to = "server/**"
name = "embedded-no-server-dep"
severity = "blocking"
provenance = "quiver/CLAUDE.md: 'embedded/ and server/ do not depend on each other'"

[[constraint]]
kind = "forbidden_dep"
from = "server/**"
to = "embedded/**"
name = "server-no-embedded-dep"
severity = "blocking"
provenance = "quiver/CLAUDE.md: 'embedded/ and server/ do not depend on each other'"

# ═══════════════════════════════════════════════════════════════════
# FFI encapsulation
# ═══════════════════════════════════════════════════════════════════
# Only arrow_swe imports swisseph. Quiver goes through SweFacade.

[[constraint]]
kind = "forbidden_external"
crates = ["swisseph"]
name = "no-direct-swisseph"
severity = "blocking"
provenance = "arrow arch: only arrow_swe imports swisseph"

# ═══════════════════════════════════════════════════════════════════
# Service independence
# ═══════════════════════════════════════════════════════════════════

[[constraint]]
kind = "no_cycles"
scope = "server/lib/src/services/"
name = "services-no-cycles"
severity = "blocking"

# ═══════════════════════════════════════════════════════════════════
# Conventions
# ═══════════════════════════════════════════════════════════════════
# All auto-detected conventions are tautological or structural truths
# (codebase is ~80% proto-generated code). Suppress all.

[conventions]
suppress = [
  "d7ab72decd364f9d",  # private → has_sig
  "89c8c2819b57ba8e",  # in:core → has_sig
  "48475aab49162aba",  # complexity:zero (component) → kind:method
  "f61a6b64b0490978",  # complexity:zero (component) → is_method
  "a9e333d778f72f6a",  # complexity:zero → kind:method
  "ee8f8e91aa97b33e",  # complexity:zero → is_method
  "f1a0c23d80133298",  # CamelCase → has_sig
  "38843d296d3b599e",  # is_const → in:core
  "95b4ef4fa320b7ba",  # is_getter → in:core
  "32967270352b30cd",  # is_factory → in:core
  "7d32358c203c9d12",  # complexity:low → kind:method
  "16627df8b6dc479f",  # complexity:low → is_method
  "f4137432032e60ce",  # CamelCase → in:core
  "cef2e968bbbc8071",  # is_static (component) → in:core
  "fd5f0a8de5d2972e",  # is_static → in:core
  "a691d6c9e0a07e18",  # in:server (component) → snake_case
  "d75158a33f522c35",  # complexity:zero (component) → in:core
  "c447defd01bfefbd",  # complexity:zero → in:core
  "239e9737e9fefcbf",  # method (component) → in:core
  "4d4b646189bfe11c",  # is_method (component) → in:core
