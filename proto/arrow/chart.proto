syntax = "proto3";
package arrow;

option java_package = "com.arjuna.arrow";

import "arrow/types.proto";
import "google/protobuf/timestamp.proto";

service ChartService {
  rpc Calculate (CalcRequest) returns (CalcResponse);
}

message CalcRequest {
  double jd_ut = 1;
  Location location = 2;
  google.protobuf.Timestamp datetime = 12;
  string datetime_iso = 13;
  CalculationPreset preset = 11;

  reserved 3, 4, 5, 6, 7, 8, 9, 10;
  reserved "sign_ayanamsa", "house_system", "true_node",
           "topocentric", "bodies", "circle",
           "nak_ayanamsa", "nak_equatorial";
}

message CalcResponse {
  EphSnapshot snapshot = 1;
  repeated PlanetPlacement placements = 2;
}
