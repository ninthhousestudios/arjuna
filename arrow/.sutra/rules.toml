  "f8d6de32e16feb6f",  # has_sig (component) → in:options
  "696dda5191ec6ba3",  # naming:snake_case (component) → in:options
  "44116625d239c5b4",  # vis:private (component) → in:core
  "f9f28537aabb8bc9",  # has_sig (component) → in:core
  "d008ccde9d2b1531",  # naming:snake_case (component) → in:core
  "e3b3db8716c28f86",  # vis:private (component) → in:calc
  "65df9eb460171110",  # has_sig (component) → in:calc
  "e0f8b9c38680142a",  # naming:snake_case (component) → in:calc
  "587431789fe3beb8",  # vis:private (component) → in:core (varga component)
  "4a482045742855b6",  # complexity:zero (component) → in:options
  "0e84224faf7dac87",  # complexity:zero (component) → in:swe
  "935661b0515b8017",  # in:claude (component) → kind:method
  "4d18b9860b7d3f01",  # in:claude (component) → has_sig
  "5411cbdbaba4e819",  # in:claude (component) → complexity:zero
  "0204f91e7d82f8b8",  # in:claude (component) → is_method
