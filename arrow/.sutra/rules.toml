# .sutra/rules.toml — Architectural constraints for Arrow
#
# Severity levels:
#   blocking      — guard denies edits that introduce these
#   advisory      — warning in review, agent proceeds
#   informational — tracked in review output, silent otherwise

# ═══════════════════════════════════════════════════════════════════
# Package boundaries
# ═══════════════════════════════════════════════════════════════════
# Dependency flows strictly left-to-right: options → swe → core → calc.
# Each package may only import from packages to its left.

[[constraint]]
kind = "forbidden_dep"
from = "options/lib/**"
to = "swe/lib/**"
name = "options-must-not-import-swe"
severity = "blocking"

[[constraint]]
kind = "forbidden_dep"
from = "options/lib/**"
to = "core/lib/**"
name = "options-must-not-import-core"
severity = "blocking"

[[constraint]]
kind = "forbidden_dep"
from = "options/lib/**"
to = "calc/lib/**"
name = "options-must-not-import-calc"
severity = "blocking"

[[constraint]]
kind = "forbidden_dep"
from = "swe/lib/**"
to = "core/lib/**"
name = "swe-must-not-import-core"
severity = "blocking"

[[constraint]]
kind = "forbidden_dep"
from = "swe/lib/**"
to = "calc/lib/**"
name = "swe-must-not-import-calc"
severity = "blocking"

[[constraint]]
kind = "forbidden_dep"
from = "core/lib/**"
to = "calc/lib/**"
name = "core-must-not-import-calc"
severity = "blocking"

# ═══════════════════════════════════════════════════════════════════
# Calc subsystem isolation
# ═══════════════════════════════════════════════════════════════════
# vedic/ and zodiac/ are independent subsystems within calc.
# Neither should depend on the other.

[[constraint]]
kind = "forbidden_dep"
from = "calc/lib/src/vedic/**"
to = "calc/lib/src/zodiac/**"
name = "vedic-must-not-import-zodiac"
severity = "blocking"

[[constraint]]
kind = "forbidden_dep"
from = "calc/lib/src/zodiac/**"
to = "calc/lib/src/vedic/**"
name = "zodiac-must-not-import-vedic"
severity = "blocking"

# ═══════════════════════════════════════════════════════════════════
# Cycle prevention
# ═══════════════════════════════════════════════════════════════════
# Each calculator/element should remain independently testable.

[[constraint]]
kind = "no_cycles"
scope = "calc/lib/src/vedic/"
name = "no-cycles-vedic-calcs"
severity = "blocking"

[[constraint]]
kind = "no_cycles"
scope = "calc/lib/src/vedic/panchanga/"
name = "no-cycles-panchanga"
severity = "blocking"

[[constraint]]
kind = "no_cycles"
scope = "calc/lib/src/zodiac/"
name = "no-cycles-zodiac"
severity = "blocking"

[[constraint]]
kind = "no_cycles"
scope = "options/lib/src/"
name = "no-cycles-options"
severity = "blocking"

# ═══════════════════════════════════════════════════════════════════
# Conventions
# ═══════════════════════════════════════════════════════════════════

