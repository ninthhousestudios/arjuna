# .sutra/rules.toml — Architectural constraints for arjuna (workspace root)
#
# sutra reads only this file for the arjuna workspace. arrow/ and quiver/ were
# once registered as separate workspaces; their rules.toml files have been
# folded in here with paths re-prefixed (arrow/..., quiver/...).
#
# Severity levels:
#   blocking      — guard denies edits that introduce these
#   advisory      — warning in review, agent proceeds
#   informational — tracked in review output, silent otherwise

# ═══════════════════════════════════════════════════════════════════
# Forbidden patterns (vidhi/language-rules/dart.toml)
# ═══════════════════════════════════════════════════════════════════

[[constraint]]
kind = "forbidden_pattern"
language = "dart"
query = '((comment) @match (#match? @match "^//+ *ignore(_for_file)?:"))'
name = "no-ignore-comments"
severity = "blocking"
provenance = "house analysis_options.yaml baseline"

# ═══════════════════════════════════════════════════════════════════
# Arrow package boundaries
# ═══════════════════════════════════════════════════════════════════
# Dependency flows strictly left-to-right: options → swe → core → calc.
# Each package may only import from packages to its left.

[[constraint]]
kind = "forbidden_dep"
from = "arrow/options/lib/**"
to = "arrow/swe/lib/**"
name = "options-must-not-import-swe"
severity = "blocking"

[[constraint]]
kind = "forbidden_dep"
from = "arrow/options/lib/**"
to = "arrow/core/lib/**"
name = "options-must-not-import-core"
severity = "blocking"

[[constraint]]
kind = "forbidden_dep"
from = "arrow/options/lib/**"
to = "arrow/calc/lib/**"
name = "options-must-not-import-calc"
severity = "blocking"

[[constraint]]
kind = "forbidden_dep"
from = "arrow/swe/lib/**"
to = "arrow/core/lib/**"
name = "swe-must-not-import-core"
severity = "blocking"

[[constraint]]
kind = "forbidden_dep"
from = "arrow/swe/lib/**"
to = "arrow/calc/lib/**"
name = "swe-must-not-import-calc"
severity = "blocking"

[[constraint]]
kind = "forbidden_dep"
from = "arrow/core/lib/**"
to = "arrow/calc/lib/**"
name = "core-must-not-import-calc"
severity = "blocking"

# ═══════════════════════════════════════════════════════════════════
# Arrow calc subsystem isolation
# ═══════════════════════════════════════════════════════════════════
# vedic/ and zodiac/ are independent subsystems within calc.
# Neither should depend on the other.

[[constraint]]
kind = "forbidden_dep"
from = "arrow/calc/lib/src/vedic/**"
to = "arrow/calc/lib/src/zodiac/**"
name = "vedic-must-not-import-zodiac"
severity = "blocking"

[[constraint]]
kind = "forbidden_dep"
from = "arrow/calc/lib/src/zodiac/**"
to = "arrow/calc/lib/src/vedic/**"
name = "zodiac-must-not-import-vedic"
severity = "blocking"

# ═══════════════════════════════════════════════════════════════════
# Quiver package layering
# ═══════════════════════════════════════════════════════════════════
# quiver/core/ is the shared foundation; quiver/server/ and quiver/embedded/
# are independent deployment modes that depend on core/ but never on each other.

[[constraint]]
kind = "forbidden_dep"
from = "quiver/core/**"
to = "quiver/server/**"
name = "core-no-server-dep"
severity = "blocking"
provenance = "quiver/CLAUDE.md: 'embedded/ and server/ do not depend on each other'"

[[constraint]]
kind = "forbidden_dep"
from = "quiver/core/**"
to = "quiver/embedded/**"
name = "core-no-embedded-dep"
severity = "blocking"
provenance = "quiver/CLAUDE.md: 'embedded/ and server/ do not depend on each other'"

[[constraint]]
kind = "forbidden_dep"
from = "quiver/embedded/**"
to = "quiver/server/**"
name = "embedded-no-server-dep"
severity = "blocking"
provenance = "quiver/CLAUDE.md: 'embedded/ and server/ do not depend on each other'"

[[constraint]]
kind = "forbidden_dep"
from = "quiver/server/**"
to = "quiver/embedded/**"
name = "server-no-embedded-dep"
severity = "blocking"
provenance = "quiver/CLAUDE.md: 'embedded/ and server/ do not depend on each other'"

# ═══════════════════════════════════════════════════════════════════
# FFI encapsulation
# ═══════════════════════════════════════════════════════════════════
# Only arrow_swe imports the Swiss Ephemeris binding. Everything else
# (quiver included) goes through SweFacade. In the pre-merge quiver
# workspace this was a workspace-wide forbidden_external; now that arrow
# lives in the same workspace it must be confined rather than forbidden.
# arrow/tool/ is build-time fixture generation, not shipped library code, and
# calls the binding directly (generate_solar_pulse.dart).

[[constraint]]
kind = "confined_external"
crates = ["swisseph_rs", "swisseph"]
allowed_in = ["arrow/swe/**", "arrow/tool/**"]
name = "swisseph-only-in-arrow-swe"
severity = "blocking"
provenance = "arrow arch: only arrow_swe imports swisseph"

# ═══════════════════════════════════════════════════════════════════
# Cycle prevention
# ═══════════════════════════════════════════════════════════════════
# Each calculator/element should remain independently testable.

[[constraint]]
kind = "no_cycles"
scope = "arrow/calc/lib/src/vedic/"
name = "no-cycles-vedic-calcs"
severity = "blocking"

[[constraint]]
kind = "no_cycles"
scope = "arrow/calc/lib/src/vedic/panchanga/"
name = "no-cycles-panchanga"
severity = "blocking"

[[constraint]]
kind = "no_cycles"
scope = "arrow/calc/lib/src/zodiac/"
name = "no-cycles-zodiac"
severity = "blocking"

[[constraint]]
kind = "no_cycles"
scope = "arrow/options/lib/src/"
name = "no-cycles-options"
severity = "blocking"

[[constraint]]
kind = "no_cycles"
scope = "quiver/server/lib/src/services/"
name = "services-no-cycles"
severity = "blocking"

# ═══════════════════════════════════════════════════════════════════
# Checkpoint 2026-08-15 — arrow/rdf serializer (checkpoint:vidya/astrology-research/6)
# ═══════════════════════════════════════════════════════════════════
# The arrow_rdf package (arrow/rdf/lib/src/: serializer, nquads, computed_view,
# view_spec, chart_computer, iri*, chart_identity, rdf_term) is the RDF/N-Quads
# serialization sink — it consumes options/swe/core (via the arrow_swe facade,
# not swisseph directly, so swisseph-only-in-arrow-swe holds) and emits canon.
# It was an entire package with no governance until this tend. Both rules below
# bind clean today (0 cycles workspace-wide; no compute→rdf edges), so blocking
# is honest.

# Each serializer unit (serializer/nquads/iri/view_spec/computed_view/…) should
# stay independently testable — same discipline as the calc subsystems above.
[[constraint]]
kind = "no_cycles"
scope = "arrow/rdf/lib/src/"
name = "no-cycles-arrow-rdf"
severity = "blocking"
provenance = "checkpoint:vidya/astrology-research/6 — arrow/rdf serializer emergent structure"

# arrow/rdf is a sink: serialization stays at the edge, the compute layers
# (options/swe/core/calc) must never depend back on the emitter.
[[constraint]]
kind = "forbidden_dep"
from = "arrow/options/lib/**"
to = "arrow/rdf/lib/**"
name = "options-must-not-import-rdf"
severity = "blocking"
provenance = "checkpoint:vidya/astrology-research/6 — arrow/rdf is a serialization sink"

[[constraint]]
kind = "forbidden_dep"
from = "arrow/swe/lib/**"
to = "arrow/rdf/lib/**"
name = "swe-must-not-import-rdf"
severity = "blocking"
provenance = "checkpoint:vidya/astrology-research/6 — arrow/rdf is a serialization sink"

[[constraint]]
kind = "forbidden_dep"
from = "arrow/core/lib/**"
to = "arrow/rdf/lib/**"
name = "core-must-not-import-rdf"
severity = "blocking"
provenance = "checkpoint:vidya/astrology-research/6 — arrow/rdf is a serialization sink"

[[constraint]]
kind = "forbidden_dep"
from = "arrow/calc/lib/**"
to = "arrow/rdf/lib/**"
name = "calc-must-not-import-rdf"
severity = "blocking"
provenance = "checkpoint:vidya/astrology-research/6 — arrow/rdf is a serialization sink"

# ═══════════════════════════════════════════════════════════════════
# Conventions
# ═══════════════════════════════════════════════════════════════════
# Deliberately absent. The legacy arrow/quiver files carried [conventions]
# suppress lists (20 + 34 hashes), but sutra no longer reads them: sutra/234
# replaced convention violations with an on-the-fly deviation report, and
# detect_deviations takes no ConventionsConfig. The only reader of
# config.suppress is FcaEngine::check, which has no production caller.
# Don't re-add a suppress list here without first checking that something
# consumes it.
